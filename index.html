      }
      @keyframes pulse {

      }
      
      /* 🚀 Critical Hero Structure (Prevents Layout Shift) */

    <div id="root-loader">
      <svg class="loader-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"></path>
      </svg>
    </div>
    <div id="root"></div>
    <script>
      // Handshake to remove loader
      const removeLoader = () => {
        const loader = document.getElementById('root-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 800);
        }
      };

      window.addEventListener('message', (event) => {
        if (event.data === 'MATRIARCH_PROTOCOL_READY' || event.data === 'MATRIARCH_SANCTUARY_READY') {
          removeLoader();
        }
      });

      // Fail-safe: If we are in an Oauth redirect, or it's been too long (reduced for SEO performance), force remove loader
      if (window.location.hash.includes('access_token')) {
        console.log("MATRIARCH_BOOT: Auth redirect detected. Prioritizing protocol UI.");
        setTimeout(removeLoader, 500); 
      }
      
      setTimeout(removeLoader, 1000); 
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 🚀 Performance: Smart Third-Party Deferral
      // We only load Google Adsense once a human has actually interacted with the Sanctuary.
      // This prevents the ~200KB script from being flagged as 'Unused JS' during the initial paint.
      (function() {
        const loadAdsense = () => {
          if (window.__ADSENSE_LOADED__) return;
          window.__ADSENSE_LOADED__ = true;
          
          const adsense = document.createElement('script');
          adsense.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8618345567810746';
          adsense.async = true;
          adsense.crossOrigin = 'anonymous';
          document.body.appendChild(adsense);
          
          // Cleanup listeners after activation
          window.removeEventListener('scroll', loadAdsense);
          window.removeEventListener('touchstart', loadAdsense);
          window.removeEventListener('mousemove', loadAdsense);
          console.log("MATRIARCH_PERF: Third-party services initialized (Interaction).");
        };

        // Trigger on any human interaction
        window.addEventListener('scroll', loadAdsense, { passive: true });
        window.addEventListener('touchstart', loadAdsense, { passive: true });
        window.addEventListener('mousemove', loadAdsense, { passive: true });
      })();
    </script>
